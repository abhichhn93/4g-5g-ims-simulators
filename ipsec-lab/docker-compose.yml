version: '3.8'

networks:
  internet:                       # simulated "internet" between the two sites
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24  # the "WAN" addresses

services:

  site-a:
    build: .                      # uses our Dockerfile (Alpine + strongSwan)
    container_name: site-a
    hostname: site-a
    networks:
      internet:
        ipv4_address: 172.20.0.10  # siteA's "WAN" IP (matches cert SAN)
    volumes:
      # Mount PKI files into strongSwan's expected directories
      - ./pki/ca/ca.crt:/etc/swanctl/x509ca/ca.crt:ro
      - ./pki/siteA/siteA.crt:/etc/swanctl/x509/siteA.crt:ro
      - ./pki/siteA/siteA.key:/etc/swanctl/private/siteA.key:ro
      # Mount our config and startup script
      - ./configs/siteA/swanctl.conf:/etc/swanctl/swanctl.conf:ro
      - ./configs/siteA/start.sh:/start.sh:ro
      # Mount capture directory so pcaps are accessible on Mac
      - ./capture:/capture
    cap_add:
      - NET_ADMIN          # needed: allows creating IPSec/xfrm policies in kernel
      - SYS_MODULE         # needed: load kernel modules for IPSec
    sysctls:
      - net.ipv4.ip_forward=1     # allow packet forwarding (like a router)
    command: ["/bin/bash", "/start.sh"]

  site-b:
    build: .
    container_name: site-b
    hostname: site-b
    networks:
      internet:
        ipv4_address: 172.20.0.20  # siteB's "WAN" IP
    volumes:
      - ./pki/ca/ca.crt:/etc/swanctl/x509ca/ca.crt:ro
      - ./pki/siteB/siteB.crt:/etc/swanctl/x509/siteB.crt:ro
      - ./pki/siteB/siteB.key:/etc/swanctl/private/siteB.key:ro
      - ./configs/siteB/swanctl.conf:/etc/swanctl/swanctl.conf:ro
      - ./configs/siteB/start.sh:/start.sh:ro
      - ./capture:/capture
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    command: ["/bin/bash", "/start.sh"]
