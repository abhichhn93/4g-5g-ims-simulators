# strongSwan swanctl.conf for SITE-A
# ─────────────────────────────────────────────────────────────────
# Think of this like AMF's NAS config: it defines WHO we talk to,
# HOW we authenticate, and WHAT traffic goes through the tunnel.

connections {

    site-a-to-b {   # name of this IKEv2 connection (arbitrary)

        # ── IKE Phase 1: control channel ─────────────────────────
        # Like NAS security negotiation — agree on algorithms first
        version = 2                   # IKEv2 (not legacy IKEv1)

        local_addrs  = 172.20.0.10    # OUR IP on the "internet" network
        remote_addrs = 172.20.0.20    # PEER IP (siteB)

        # Algorithms for the IKE control channel itself
        # aes256    = encryption (like EEA2 in 5G)
        # sha256    = integrity  (like EIA2 in 5G)
        # modp2048  = Diffie-Hellman group for key exchange
        proposals = aes256-sha256-modp2048

        # ── Who we are and how we prove it ───────────────────────
        local {
            auth = pubkey             # authenticate using certificate (not PSK)
            certs = siteA.crt        # OUR certificate
            id = 172.20.0.10         # must match the SAN IP in our cert
        }

        # ── Who the peer is and what we accept ───────────────────
        remote {
            auth = pubkey            # we REQUIRE the peer to also use a cert
            id = 172.20.0.20         # must match the SAN IP in siteB's cert
        }

        # ── IKE Phase 2: data tunnel (CHILD_SA) ──────────────────
        # Like GTP-U bearer setup after NAS auth
        children {
            tunnel {
                # Encrypt actual data packets with AES-GCM
                # (GCM = authenticated encryption: encrypt + integrity in one)
                esp_proposals = aes256gcm128

                # TUNNEL MODE: wrap the original packet in a new ESP packet
                # Original IP header is hidden — new outer IP is the gateway IP
                mode = tunnel

                # Which traffic goes INTO the tunnel
                # 10.0.0.0/24 = siteA's "LAN" (inside the container)
                # 10.0.1.0/24 = siteB's "LAN" (inside the other container)
                local_ts  = 10.0.0.0/24    # traffic FROM siteA's LAN
                remote_ts = 10.0.1.0/24    # traffic TO   siteB's LAN

                # Automatically start the tunnel when this config loads
                start_action = start
            }
        }
    }
}

# ── Certificate and key locations ────────────────────────────────
# strongSwan looks in /etc/swanctl/x509/  for certs
#               in /etc/swanctl/private/ for private keys
#               in /etc/swanctl/x509ca/  for CA certs
secrets {
    private-siteA {
        file = siteA.key   # our private key (never leaves this box)
    }
}
