# kpi-consumer Deployment + Service.
#
# replicas: 2 is deliberate, not arbitrary — it's what makes the consumer-group
# behavior actually visible. Both pods join Kafka consumer group KAFKA_GROUP_ID
# ("kpi-readers"); Kafka splits the topic's partitions (KAFKA_NUM_PARTITIONS=3
# in docker-compose.kafka.yml) between them automatically, so each pod handles
# a disjoint subset of events, not a duplicate copy of the whole stream. Kill
# one pod and Kafka rebalances its partitions onto the survivor within seconds
# — no code change, no coordination logic in this service at all, that's
# entirely the consumer-group protocol.
#
# KAFKA_BROKERS below is a placeholder: this repo's Kafka only runs via
# docker/docker-compose.kafka.yml on the host, not as a K8s workload. To test
# this Deployment against real Kafka in-cluster, either deploy Kafka with the
# Strimzi operator (the standard way to run Kafka on K8s) or point
# KAFKA_BROKERS at a reachable external broker. Left as a placeholder rather
# than faked working config, matching this repo's convention of being honest
# about what's wired up vs. what's a documented next step.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-kpi-consumer
  labels:
    app: go-kpi-consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-kpi-consumer
  template:
    metadata:
      labels:
        app: go-kpi-consumer
    spec:
      containers:
        - name: kpi-consumer
          image: go-kpi-consumer:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: go-services-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: go-kpi-consumer-svc
spec:
  selector:
    app: go-kpi-consumer
  ports:
    - port: 8084
      targetPort: 8084
