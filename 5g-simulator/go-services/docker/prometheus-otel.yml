global:
  scrape_interval: 15s

scrape_configs:
  # Scrape OTEL Collector's Prometheus exporter (aggregated metrics from all services)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Scrape kpi-consumer's /metrics directly (has both promauto + OTEL bridge metrics)
  # This is the "both in one endpoint" demo: run the consumer with OTLP_ENDPOINT set.
  - job_name: kpi-consumer
    static_configs:
      - targets: ["host.docker.internal:8084"]

  # Collector self-monitoring
  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
